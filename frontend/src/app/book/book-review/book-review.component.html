<div class="card mt-4 border-0 shadow-sm bg-white p-3">
    <h5 class="fw-bold text-secondary mb-3">
      <i class="fas fa-comments me-2"></i>Reader Reviews
    </h5>
  
    <div class="list-group list-group-flush">
      <div class="list-group-item py-3 px-0" *ngFor="let r of reviews">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <strong class="text-primary">{{ r.user }}</strong>
          <span class="badge bg-warning text-dark">⭐ {{ r.rating }}/5</span>
        </div>
        <p class="mb-0 text-muted small">{{ r.comment }}</p>
      </div>
    </div>
  </div>
