<div class="card h-100 shadow-sm border-0 rounded-3 text-center p-3">
   <div class="position-relative overflow-hidden rounded-3 mb-3" style="height: 250px; background-color: #f8f9fa;">
    <img [src]="'assets/' + book.imgUrl" [alt]="book.title" class="img-fluid">
   </div>
   
   <div class="card-body p-0 d-flex flex-column justify-content-between">
     <div>
       <h6 class="text-warning mb-1">
         <i class="bi bi-star-fill"></i>
         <i class="bi bi-star-fill"></i>
         <i class="bi bi-star-fill"></i>
         <i class="bi bi-star-fill"></i>
         <span class="text-muted ms-1 small">(4.8 / 5.0)</span>
       </h6>
       <h5 class="card-title text-dark fw-bold mb-1 text-truncate">{{ book.title }}</h5>
       <p class="text-muted small mb-3">by {{ book.author }}</p>
     </div>
     
     <div>
       <h5 class="text-danger fw-bold mb-3">${{ book.price }}</h5>
       <div class="d-grid gap-2 d-md-flex justify-content-md-center">
         <a [routerLink]="['/home/book', book.id]" class="btn btn-sm btn-outline-dark px-3 rounded-pill">
           <i class="bi bi-eye"></i> Details
         </a>
         <button (click)="addToCart(book)" class="btn btn-sm btn-dark px-3 rounded-pill">
          <i class="bi bi-cart-plus"></i> + Cart
        </button>
       </div>
     </div>
   </div>
 </div>
