<div class="container my-5">
  <h2>My Shopping Cart</h2>
  
  <div *ngIf="(cartService.$cart | async) as items" class="border rounded p-3 mb-4">
    <div *ngFor="let book of items" class="row border-bottom py-3">
       <div class="col-2">
         <img [src]="'assets/' + book.imgUrl" class="img-fluid" width="50">
       </div>
       <div class="col-6">
         <h5>{{ book.title }}</h5>
         <small class="text-muted">by {{ book.author }}</small>
       </div>
       <div class="col-4 text-end">
         <span class="badge bg-success">US${{ book.price }}</span>
       </div>
    </div>
  </div>
  <div class="d-flex justify-content-end align-items-center mt-4 p-3 bg-light border rounded">
    <h5 class="ms-auto me-4 mb-0 text-muted">
      Total Items: <span class="fw-bold text-dark">{{ totalItems }}</span>
    </h5>
  </div>
  
  <div class="d-flex justify-content-end align-items-center mt-4 p-3 bg-light border rounded">
    <h4 class="me-4 mb-0">
      Total Amount: <span class="text-danger fw-bold">${{ totalPrice | number:'1.2-2' }}</span>
    </h4>
    
    <button (click)="onCheckout()" class="btn btn-success btn-lg px-5">
      Proceed to Checkout
    </button>
  </div>
</div>
